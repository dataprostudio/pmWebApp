<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Mining Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h1 class="logo">Process Mining</h1>
            <ul class="nav-links">
                <li class="active"><a href="#data">Data</a></li>
                <li><a href="#visualization">Visualization</a></li>
                <li><a href="#analysis">Analysis</a></li>
                <li><a href="#simulation">Simulation</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Data Input</h2>
            
            <!-- File Upload Section -->
            <section class="card">
                <h3>File Upload</h3>
                <div class="upload-container">
                    <input type="file" id="fileUpload" class="file-input" accept=".csv,.txt">
                    <label for="fileUpload" class="file-label">Choose File</label>
                    <button class="upload-btn" id="uploadButton">Upload</button>
                </div>
            </section>

            <!-- Real Time Data Section -->
            <section class="card">
                <h3>Real Time Data</h3>
                <div class="api-container">
                    <select class="data-source-select">
                        <option value="salesforce">Salesforce</option>
                        <option value="sap">SAP</option>
                        <option value="oracle">Oracle</option>
                    </select>
                    <input type="text" placeholder="Enter API Key" class="api-input">
                    <button class="connect-btn">Connect</button>
                </div>
            </section>

            <!-- Visualization Section -->
            <section class="card">
                <h3>Process Flow Visualization</h3>
                <div id="visualization" class="visualization-container"></div>
            </section>

            <!-- Analysis Section -->
            <section class="card">
                <h3>Process Analysis</h3>
                <div id="analysis" class="analysis-container"></div>
            </section>
        </main>
    </div>
    <script src="fetch.js"></script>
</body>
</html>
